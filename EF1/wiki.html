function inDungeon(x, y) { return x >= 4 && x <= 27 && y >= 69 && y <= 92; }
function regionNameFor(x, y) {
  if (inDungeon(x, y)) return 'Ashen Barrow';
  let best = REGION_LANDMARKS[0], bestD = Infinity;
  for (const l of REGION_LANDMARKS) {
    const d = (x - l[0]) ** 2 + (y - l[1]) ** 2;
    if (d < bestD) { bestD = d; best = l; }
  }
  return best[2];
}

// ---------- World lore: The Bound Ember ----------
const LORE = [
  { title: 'The Emberfall', body: 'An age ago, a shard of living fire fell from the sky in a night still remembered as the Emberfall — the night that gave this land its name. Where it struck, the earth burned and the dead would not rest, for the fire was no mere flame but a hungry will that sought to consume all it touched and remake the world as ash. Kingdoms that had stood a thousand years guttered out in a single season.' },
  { title: 'The Bound Ember', body: 'Fire cannot be unmade. So the Ember could not be destroyed — only contained. A fellowship of guardians drove the living fire deep beneath the earth, into the black hollow that became the Ashen Barrow, and there they bound it. It waits below still: patient, burning, and awake. Everything in Emberfall — the Ember runes, the ember-forged steel, the fever in the marsh, the heat of the volcano — is an echo of that buried fire leaking through the seals.' },
  { title: 'The Wardens of Ash', body: 'The guardians who bound the Ember were the Wardens of Ash. They sealed the fire behind three seals forged from what they valued most — their Oath, their Watch, and their Cinders (their very lives). "Three seals became one relic. One relic became a door." The greatest among them gave up their body and death itself to become the Ashen Warden, an undying sentinel set at the door with a single charge: keep it shut, and wake only if the seal breaks and the eastern bell falls silent. Over the centuries the order dwindled to a handful of scattered watchers who barely remember their own purpose.' },
  { title: 'The Seven Regions', body: 'The scarred land slowly healed into seven regions, each shaped by how near it lies to the buried fire. GREENREST VALE is the green heart, farthest from the wound — peaceful meadows and the town where travellers gather. PINEHOLT holds the northern road, guarded by watch-captains descended from Warden scouts. FROSTMERE lies in the far north, where deep cold holds the Ember\'s heat at bay. THORNWOOD, the eastern woodland, keeps the old Warden verses alive as hunters\' ballads. CINDERFORGE sits closest to the fire; its smiths work ember-touched ore beside a stirring volcano. SABLEMARSH, the southern swamp, suffers a marsh-fever that seeps up from below. And the ASHFALL WASTES are the cursed ground directly above the Barrow, where ash falls like snow and the dead walk.' },
  { title: 'The Failing Seals', body: 'The seals are giving way. Cinderforge\'s fires climb higher each week, the Ashfall spreads, marsh-fever worsens in Sablemarsh, and beasts and worse spill out of the wastes into the settled lands. The scattered Wardens — Scholar Mira the loremaster, Captain Rowan of the northern watch, Scout Vale at the Barrow door, Guard Bren in the Vale — feel the danger they were born to guard against returning, and know their thinning order cannot hold it alone.' },
  { title: 'The Wanderer', body: 'You are the Wanderer. You woke at the edge of Greenrest Vale with no memory of who you are or how you came to be here — and on that same night, the ancient Barrow tablets glowed. The Ember stirs when you draw near; the undying Warden does not strike you down on sight as it would any other. The watchers have come to suspect the truth: that you are the last of the Warden bloodline, ember-touched, the one hand that might reach the bound fire and choose — to re-seal the door forever, or to open it.' },
  { title: 'Factions', body: 'THE WARDENS OF ASH — the fading order sworn to keep the Ember bound (Mira, Rowan, Vale, Bren). They quietly test and guide the Wanderer. THE EMBERWRIGHTS of Cinderforge — smiths like Torren who harness the Ember\'s heat to forge peerless steel; some revere the fire, some fear it. THE COMMON FOLK — traders, farmers, innkeepers and healers across the seven regions who know only rumours and hardship, living in the shadow of a danger most have half-forgotten.' },
];
function loreHTML() {
  const cards = LORE.map((l) => `<div class="card" data-name="lore ${esc(l.title)}">
    <h3>${esc(l.title)}</h3>
    <p style="line-height:1.55;margin:6px 0 0">${esc(l.body)}</p>
  </div>`).join('');
  return `<section id="lore"><h2>Lore — The Bound Ember</h2><div class="grid" style="grid-template-columns:1fr">${cards}</div></section>`;
}

    'Fight the Ashen Warden (level 30). At half health it tears its ember seal and ENRAGES, hitting harder and faster.',
    'Watch the floor — the Warden marks tiles with burning sigils. Step off a marked tile before it detonates.',
    'After the Warden falls, open the Warden chest for coins and a shot at uniques: Warden cloak, Ashen guard, or Barrow lantern — then its light carries you straight back outside the entrance archway.',
    'Your clear time is recorded, and the nine chambers re-seal with a fresh random order for your next run.' ] },
  { title: 'Boss guide: the Ashen Warden', steps: [
    'Location: the ninth chamber of the Ashen Barrow grid — always the last one reached, only after all eight guarded chambers are cleared.',
    'Stats: 30 HP, hits for up to 4, attacks from up to 6 tiles away, and gives 90 combat XP.',

    'Reward: the kill unseals the Warden chest — coins plus a chance at the Warden cloak, Ashen guard, Barrow lantern, and an Emberforged ingot. The eight chamber monsters you had to clear to reach him already put you around 70% reward potential by default.',
    'Shortcut: in Admin mode you are invincible, so you can walk in and kill it freely to test the fight.' ] },
  { title: 'Making money', steps: [
    'Sell monster drops and surplus gear to shops.',
    'Fish and cook, or mine and smith, then sell the products.',
    'Complete quests and Guard Bren\'s contracts for coin rewards.',
    'Discover all seven regions for a bonus, and clear the Barrow chest for high-value loot.' ] },
  { title: 'Admin / god mode', steps: [
    'Click the Admin button (bottom-left) and enter the passcode.',
    'Admin mode makes you invincible and always running, and unlocks an item spawner.',
    'Open the Admin panel for: Spawn items, +1000 coins, Heal, and Set all skills to 99.',
    'Click Admin again to reopen the panel, or choose "Disable admin mode" to return to normal play.' ] },

function guidesHTML() {
  const cards = GUIDES.map((g) => `<div class="card" data-name="how to ${esc(g.title)}">
    <h3>${esc(g.title)}</h3>
    <ol class="steps">${g.steps.map((s) => `<li>${esc(s)}</li>`).join('')}</ol>
  </div>`).join('');
  return `<section id="guides"><h2>How-to Guides (${GUIDES.length})</h2><div class="grid">${cards}</div></section>`;
}

// ---------- build item source index ----------
const soldBy = {}, droppedBy = {};
for (const [key, list] of Object.entries(SHOPS)) for (const [id, price] of list) (soldBy[id] = soldBy[id] || []).push({ shop: SHOP_TITLE[key] || key, price });
for (const [kind, m] of Object.entries(MONSTER_TYPES)) for (const d of m.drops) (droppedBy[d[0]] = droppedBy[d[0]] || []).push(m.name);

// monster -> regions where it spawns
const monsterRegions = {};
for (const [kind, x, y] of MONSTER_SPAWNS) {
  const r = regionNameFor(x, y);
  (monsterRegions[kind] = monsterRegions[kind] || new Set()).add(r);
}

// ---------- renderers ----------
function itemType(it) {
  if (it.attack) return 'Weapon (melee)';
  if (it.ranged) return 'Weapon (ranged)';
  if (it.magic) return 'Weapon (magic)';
  if (it.slot === 'armor') return 'Armour (body)';
  if (it.slot === 'shield') return 'Shield';
  if (it.slot === 'gloves') return 'Gloves';
  if (it.heal) return 'Food';
  if (it.energy) return 'Potion';
  if (it.cure) return 'Food (cures poison)';
  return 'Item';
}

function peopleHTML() {
  const cards = NPCS.map((n) => {
    const region = regionNameFor(n.x, n.y);
    const shopKey = NPC_SHOP[n.id];
    const shop = shopKey ? SHOPS[shopKey] : null;
    const quotes = [n.dialogue, ...((NPC_AMBIENT[n.id]) || [])].filter(Boolean);
    return `<div class="card" id="npc-${n.id}" data-name="${esc(n.name)} ${esc(n.role)} ${region}">
      <h3>${esc(n.name)}</h3>
      <div class="role">${esc(n.role)}</div>
      <span class="badge region">${region}</span>
      ${shop ? `<span class="badge">Shopkeeper</span>` : ''}
      ${shop ? `<div class="kv"><b>Sells:</b><ul class="tight">${shop.map(([id, p]) => `<li>${esc(ITEMS[id]?.name || id)} — ${p} coins</li>`).join('')}</ul></div>` : ''}
      ${quotes.length ? `<div class="kv"><b>Quotes</b>${quotes.map((q) => `<div class="quote">“${esc(q)}”</div>`).join('')}</div>` : ''}
    </div>`;
  }).join('');
  return `<section id="people"><h2>People of Emberfall (${NPCS.length})</h2><div class="grid">${cards}</div></section>`;
}

function placementHTML() {
  const rows = NPCS.map((n) => {
    const region = regionNameFor(n.x, n.y);
    const shopKey = NPC_SHOP[n.id];
    const tags = [];
    if (NPC_INVOLVEMENT[n.id]) tags.push(NPC_INVOLVEMENT[n.id]);
    if (shopKey) tags.push('Shop: ' + (SHOP_TITLE[shopKey] || shopKey));
    if (!tags.length) tags.push('Ambient / flavor');
    return { n, region, purpose: tags.join(' · ') };
  }).sort((a, b) => REGION_ORDER.indexOf(a.region) - REGION_ORDER.indexOf(b.region) || a.n.name.localeCompare(b.n.name));
  const trs = rows.map(({ n, region, purpose }) => `<tr class="searchable" data-name="${esc(n.name)} ${esc(region)} ${esc(purpose)}">
      <td><a class="wlink" href="#npc-${n.id}">${esc(n.name)}</a></td>
      <td>${n.x}, ${n.y}</td>
      <td><span class="badge region">${region}</span></td>
      <td>${esc(purpose)}</td>
    </tr>`).join('');
  return `<section id="placement"><h2>NPC Placement Reference (${NPCS.length})</h2>
    <p style="color:var(--dim);font-size:13px;margin:0 0 10px">Coordinates and purpose for every NPC currently in the world — for planning new additions in the map editor without duplicating a spot or a role.</p>
    <div class="tableWrap"><table class="placement"><thead><tr><th>Name</th><th>Coordinates</th><th>Region</th><th>Purpose</th></tr></thead><tbody>${trs}</tbody></table></div>
  </section>`;
}

function monstersHTML() {
  const cards = Object.entries(MONSTER_TYPES).map(([kind, m]) => {
    const regions = [...(monsterRegions[kind] || [])];
    const drops = m.drops.map((d) => {
      const [id, lo, hi, chance] = d;
      const qty = lo === hi ? lo : `${lo}–${hi}`;
      const rate = chance ? `${Math.round(chance * 100)}%` : 'Always';
      return `<tr><td>${esc(ITEMS[id]?.name || id)}</td><td>${qty}</td><td>${rate}</td></tr>`;
    }).join('');
    return `<div class="card" id="monster-${kind}" data-name="${esc(m.name)} ${regions.join(' ')}">
      <h3>${esc(m.name)}</h3>
      <div class="role">${regions.map((r) => `<span class="badge region">${r}</span>`).join('') || '<span class="badge region">Unknown</span>'}</div>
      <div class="kv"><b>Hitpoints:</b> <span class="stat">${m.hp}</span> &nbsp; <b>Max hit:</b> <span class="stat">${m.maxHit}</span> &nbsp; <b>XP:</b> <span class="stat">${m.xp}</span></div>
      <div class="kv"><b>Drops</b><table class="drops">${drops}</table></div>
    </div>`;
  }).join('');
  return `<section id="monsters"><h2>Monsters (${Object.keys(MONSTER_TYPES).length})</h2><div class="grid">${cards}</div></section>`;
}

function itemsHTML() {
  const cards = Object.entries(ITEMS).filter(([id]) => id !== 'coins').map(([id, it]) => {
    const stats = [];
    if (it.attack) stats.push(`+${it.attack} attack`);
    if (it.ranged) stats.push(`+${it.ranged} ranged`);
    if (it.magic) stats.push(`+${it.magic} magic`);
    if (it.defence) stats.push(`+${it.defence} defence`);
    if (it.heal) stats.push(`heals ${it.heal}`);
    if (it.energy) stats.push(`+${it.energy}% run energy`);
    if (it.cure) stats.push('cures poison');
    const sources = [];
    if (soldBy[id]) sources.push('Sold by ' + soldBy[id].map((s) => `${s.shop} (${s.price}gp)`).join(', '));
    if (droppedBy[id]) sources.push('Dropped by ' + droppedBy[id].join(', '));
    return `<div class="card" id="item-${id}" data-name="${esc(it.name)} ${itemType(it)}">
      <h3>${esc(it.name)}</h3>
      <div class="role">${itemType(it)}${it.stack ? ' · stackable' : ''}</div>
      ${stats.length ? `<div class="kv"><b>Stats:</b> ${stats.join(', ')}</div>` : ''}
      <div class="kv"><b>Value:</b> ${it.value || 0} coins</div>
      ${sources.length ? `<div class="kv"><b>Obtain:</b><ul class="tight">${sources.map((s) => `<li>${esc(s)}</li>`).join('')}</ul></div>` : `<div class="kv role">Made via a skill or given as a quest reward.</div>`}
    </div>`;
  }).join('');
  return `<section id="items"><h2>Items (${Object.keys(ITEMS).length - 1})</h2><div class="grid">${cards}</div></section>`;
}

function questsHTML() {
  const main = QUESTS.map((q) => `<div class="card" data-name="${esc(q.name)}">
    <h3>${esc(q.name)}</h3><div class="role">Main quest</div>
    <ol class="steps">${q.steps.map((s) => `<li>${esc(s)}</li>`).join('')}</ol>
    <div class="reward"><b>Reward:</b> ${esc(q.reward)}</div>
  </div>`).join('');
  const side = SIDE_QUESTS.map((q) => `<div class="card" data-name="${esc(q.name)} ${esc(q.giver)}">
    <h3>${esc(q.name)}</h3><div class="role">Side quest · ${esc(q.giver)}</div>
    <ol class="steps">${q.steps.map((s) => `<li>${esc(s)}</li>`).join('')}</ol>
    <div class="reward"><b>Reward:</b> ${esc(q.reward)}</div>
  </div>`).join('');
  return `<section id="quests"><h2>Quests (${QUESTS.length + SIDE_QUESTS.length})</h2><div class="grid">${main}${side}</div></section>`;
}

function skillsHTML() {
  const cards = Object.entries(SKILL_GUIDE).map(([name, g]) => `<div class="card" data-name="${name}">
    <h3>${name}</h3>
    <div class="kv role">${esc(g.about)}</div>
    <ul class="tight">${g.tiers.map(([lv, t]) => `<li><span class="guide-lv">Lv ${lv}</span> ${esc(t)}</li>`).join('')}</ul>
  </div>`).join('');
  return `<section id="skills"><h2>Skills (${Object.keys(SKILL_GUIDE).length})</h2><div class="grid">${cards}</div></section>`;
}

document.getElementById('main').innerHTML =
  loreHTML() + guidesHTML() + peopleHTML() + placementHTML() + monstersHTML() + itemsHTML() + questsHTML() + skillsHTML();

// scroll to hash target (from map links) and flash it
function gotoHash() {
  if (!location.hash) return;
  const el = document.getElementById(location.hash.slice(1));
  if (el) {
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.style.transition = 'box-shadow .3s';
    el.style.boxShadow = '0 0 0 2px var(--gold)';
    setTimeout(() => (el.style.boxShadow = ''), 1600);
  }
}
addEventListener('hashchange', gotoHash);
setTimeout(gotoHash, 60);

// live search
const search = document.getElementById('search');
search.addEventListener('input', () => {
  const q = search.value.trim().toLowerCase();
  for (const card of document.querySelectorAll('.card')) {
    const hay = (card.dataset.name + ' ' + card.textContent).toLowerCase();
    card.style.display = !q || hay.includes(q) ? '' : 'none';
  }
  for (const row of document.querySelectorAll('tr.searchable')) {
    const hay = (row.dataset.name + ' ' + row.textContent).toLowerCase();
    row.style.display = !q || hay.includes(q) ? '' : 'none';
  }
  for (const sec of document.querySelectorAll('section')) {
    const anyCard = [...sec.querySelectorAll('.card')].some((c) => c.style.display !== 'none');
    const anyRow = [...sec.querySelectorAll('tr.searchable')].some((r) => r.style.display !== 'none');
    sec.style.display = anyCard || anyRow ? '' : 'none';
  }
});
</script>
</body>
</html>
