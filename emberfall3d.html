<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emberfall 3D (prototype)</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #c3d { display: block; width: 100vw; height: 100vh; }
  #hud {
    position: fixed; top: 10px; left: 12px; max-width: 60vw;
    color: #ffd23f; font-family: "Trebuchet MS", Verdana, sans-serif; font-size: 13px;
    text-shadow: 0 1px 3px #000; pointer-events: none; line-height: 1.5;
  }
  #hud b { color: #fff; }
  #hudmsg { color: #b8d8ff; }
</style>
</head>
<body>
<canvas id="c3d"></canvas>
<div id="hud">
  <b>Emberfall 3D — prototype</b><br>
  Left-click ground to move · scroll to zoom · right-drag to rotate<br>
  <span id="hudmsg">Booting…</span>
</div>

<!-- Three.js core (r128) + GLTF loader for your world model -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<!-- shared world data (items, monsters, layout, helpers) -->
<script src="js/data.js"></script>
<!-- the 3D renderer -->
<script src="js/engine3d.js"></script>
</body>
</html>
