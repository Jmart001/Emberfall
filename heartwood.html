<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emberfall — Heartwood (3D)</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: "Trebuchet MS", Verdana, sans-serif; }
  #c3d { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; top: 10px; left: 12px; max-width: 46vw; color: #ffd23f; font-size: 13px; text-shadow: 0 1px 3px #000; pointer-events: none; line-height: 1.5; }
  #hud b { color: #fff; } #hudmsg { color: #bfe6ff; }

  /* game UI sidebar */
  #ui { position: fixed; top: 0; right: 0; width: 260px; height: 100vh; box-sizing: border-box;
    background: linear-gradient(#2b2519, #201b12ee); border-left: 3px solid #5c5142; padding: 8px;
    display: flex; flex-direction: column; gap: 6px; color: #d8c9a3; font-size: 12px; }
  #stats { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .stat { background: linear-gradient(#443b2d, #37301f); border: 1px solid #5c5142; border-radius: 3px; padding: 3px 6px; color: #ffd23f; }
  .stat small { color: #b8a888; }
  #tabs { display: flex; gap: 4px; }
  #tabs button { flex: 1; background: linear-gradient(#4a4033, #352d22); color: #ff981f; border: 2px solid #5c5142; padding: 5px 0; cursor: pointer; font: inherit; border-radius: 3px; }
  #tabs button.active { background: linear-gradient(#6a5c42, #4a4033); color: #ffd23f; }
  #panel { flex: 1; overflow-y: auto; }
  #panel h4 { color: #ffd23f; margin: 4px 0; } #panel h5 { color: #b8a888; margin: 8px 0 3px; font-weight: normal; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .islot { background: linear-gradient(#443b2d, #37301f); border: 1px solid #5c5142; border-radius: 3px; padding: 3px; text-align: center; cursor: pointer; position: relative; min-height: 40px; }
  .islot:hover { border-color: #ffd23f; } .islot .ic { font-size: 18px; display: block; } .islot .nm { font-size: 8px; color: #d8c9a3; }
  .islot .q { position: absolute; top: 1px; right: 3px; font-size: 10px; color: #ff0; text-shadow: 1px 1px 0 #000; }
  .row { display: flex; align-items: center; gap: 5px; padding: 3px 5px; background: linear-gradient(#443b2d, #37301f); border: 1px solid #5c5142; border-radius: 3px; margin-bottom: 3px; }
  .row .grow { flex: 1; color: #d8c9a3; } .row small { color: #b8a888; }
  .row button, .wide { background: #5c5142; color: #ffd23f; border: 1px solid #8a7a5c; padding: 3px 7px; cursor: pointer; font: inherit; border-radius: 3px; font-size: 11px; }
  .row button:disabled { opacity: .35; cursor: default; }
  .wide { width: 100%; padding: 6px; margin-top: 6px; }
  .srow { background: linear-gradient(#443b2d, #37301f); border: 1px solid #5c5142; border-radius: 3px; padding: 5px 7px; margin-bottom: 5px; }
  .srow .bar { height: 5px; background: #2a2418; border-radius: 2px; margin: 3px 0; overflow: hidden; } .srow .bar div { height: 100%; background: #3fa7a0; }
  .empty, .hint { color: #b8a888; font-size: 11px; padding: 6px 0; }
  #chat { height: 96px; overflow-y: auto; background: #241f15; border: 1px solid #5c5142; border-radius: 3px; padding: 3px 6px; font-size: 11px; line-height: 1.4; }
  #chat div { color: #d8c9a3; }
  @media (max-width: 720px) { #ui { width: 190px; } #hud { max-width: 40vw; } }
</style>
</head>
<body>
<canvas id="c3d"></canvas>
<div id="hud">
  <b>Heartwood — 3D</b><br>
  Click to walk · scroll zoom · right-drag rotate · <b>G</b> grid<br>
  <span id="hudmsg">Booting…</span>
</div>

<div id="ui">
  <div id="stats"></div>
  <div id="tabs">
    <button data-tab="inv" class="active">🎒 Items</button>
    <button data-tab="skills">📊 Skills</button>
    <button data-tab="smith">⚒️ Smith</button>
  </div>
  <div id="panel"></div>
  <div id="chat"></div>
</div>

<div id="picker">
  <div class="card"><div class="title">Load the world model</div>
    <p>Pick (or drag in) <b>heartwood-plains1.glb</b>.</p>
    <label class="pbtn">📂 Choose file<input id="glbfile" type="file" accept=".glb,.gltf" hidden></label></div>
</div>
<style>
  #picker { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(8,10,14,.55); }
  #picker .card { background: #241f15; border: 2px solid #6a5c40; border-radius: 8px; padding: 22px; max-width: 340px; color: #d8c9a3; text-align: center; }
  #picker .title { color: #ffd23f; font-size: 17px; font-weight: bold; margin-bottom: 8px; }
  #picker .pbtn { display: inline-block; cursor: pointer; background: #5c5142; color: #ffd23f; border: 1px solid #8a7a5c; border-radius: 5px; padding: 9px 16px; }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>

<script src="js/player-model.js"></script>
<script src="js/heartwood-model.js"></script>
<script src="js/data.js"></script>
<script src="js/game3d.js"></script>
<script src="js/location3d.js"></script>
<script>if (window.Game) Game.init();</script>
</body>
</html>
